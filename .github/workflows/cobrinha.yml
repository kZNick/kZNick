name: Atualizar cobrinha de contribuições

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cobrinha.yml"
      - "scripts/grow_snake.py"
      - "scripts/test_grow_snake.py"

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Obter o script de crescimento
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Testar o crescimento da cobrinha
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Gerar animações para os temas claro e escuro
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Fazer a cobrinha crescer ao comer contribuições
        run: python3 scripts/grow_snake.py dist/*.svg

      - name: Verificar se o calendário foi gerado
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in Path("dist").glob("*.svg"):
              root = ET.parse(path).getroot()
              width = float(root.attrib["viewBox"].split()[2])
              if width < 700:
                  raise SystemExit(f"Calendário incompleto em {path}: largura {width}")
          if len(list(Path("dist").glob("*.svg"))) != 2:
              raise SystemExit("As duas versões da animação devem ser geradas.")
          PY

      - name: Publicar animações na branch output
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
