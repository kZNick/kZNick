  <text x="705" y="142" font-family="Consolas,monospace" font-size="64" font-weight="700" fill="#63e6be" opacity=".65">&lt;/&gt;</text>
  <rect x="793" y="160" width="15" height="4" rx="2" fill="#74b9ff">
