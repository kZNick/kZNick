    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c30"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#63e6be"/><stop offset="1" stop-color="#74b9ff"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a5d8ff" stroke-opacity=".05"/></pattern>
